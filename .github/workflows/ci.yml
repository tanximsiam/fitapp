name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    name: Type-check, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx vue-tsc --noEmit
      # Contract tests are skipped here: they need the backend (see README, "API contract tests").
      - run: npx vitest run
      - run: npx vite build

  android:
    name: Android debug build
    needs: web
    runs-on: ubuntu-latest
    env:
      FITAPP_VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npx vite build
      - run: npx cap sync android
      - run: ./gradlew assembleDebug --no-daemon
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: fitapp-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
