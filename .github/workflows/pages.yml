# Publishes the browser-only demo to GitHub Pages. Run it manually after enabling
# Settings → Pages → Source: GitHub Actions. No backend or secrets are involved.
name: Deploy demo to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    defaults:
      run:
        working-directory: frontend-fitapp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend-fitapp/package-lock.json
      - run: npm ci
      # Project sites live under /<repository>/; leaving VITE_BACKEND_URI empty builds the demo.
      - run: npm run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
      # Single-page app fallback for deep links.
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend-fitapp/dist
      - id: deployment
        uses: actions/deploy-pages@v4
