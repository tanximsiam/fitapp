<!DOCTYPE html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <title>FitApp</title>
    <meta name="description" content="Open-source, watch-centred health website for activity, sleep, heart rate and personal records." />
    <meta name="viewport" content="viewport-fit=cover, width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fbfbfb" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <script>
      // Apply the saved theme before first paint to avoid a flash (light unless chosen otherwise).
      try {
        var t = localStorage.getItem('fitapp.theme')
        var dark = t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
      } catch (e) {}
    </script>
  </head>

  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
