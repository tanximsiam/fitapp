openapi: 3.1.0
info:
  title: FitApp API
  version: 1.0.0
  description: |
    FitApp's own Laravel API. Two kinds of clients use it:

    * **The FitApp apps** sign in with `POST /login` (or register, or Google) and receive a token with the `app` ability.
    * **Uploads** (`POST /ingest`) use the same token: the phone app sends what it read from Health Connect or Apple Health.

    Conventions:
    * All bodies are JSON. Successful responses wrap results in `data`.
    * Errors return `{ "message": "..." }`; validation errors (422) add `errors` keyed by field path.
    * `date` fields are local calendar dates (`YYYY-MM-DD`) as the source experienced them.
    * Instants are ISO 8601 with an explicit offset. They are stored in UTC and returned in the user's timezone.
    * Units: distance in metres, energy in kilocalories (active energy only), durations in minutes, heart rate in bpm.
    * A missing measurement is `null`, never `0`.
servers:
  - url: http://localhost:8000/api
    description: Local development
security:
  - bearerAuth: []
tags:
  - name: Auth
  - name: Fitness
    description: Read model used by the frontend (`app` ability).
  - name: Ingestion
    description: Upload interface for external sources (`ingest` ability).
  - name: Journal
    description: Manually entered mood, meals, hydration and cycle records (`app` ability). Ingestion never writes these.

paths:
  /login:
    post:
      tags: [Auth]
      security: []
      summary: Exchange credentials for an app token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
                device_name: { type: string, maxLength: 100 }
      responses:
        '200':
          description: Signed in
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      user: { $ref: '#/components/schemas/User' }
                      token: { type: string, description: 'Send as `Authorization: Bearer <token>`.' }
        '401': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { description: Too many attempts }

  /register:
    post:
      tags: [Auth]
      security: []
      summary: Create an account and get an app token
      description: Off when the server sets `FITAPP_REGISTRATION=false` (403).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password]
              properties:
                name: { type: string, maxLength: 255 }
                email: { type: string, format: email }
                password: { type: string, minLength: 8 }
                timezone: { type: string, description: IANA zone, defaults to UTC }
                device_name: { type: string, maxLength: 100 }
      responses:
        '201':
          description: Account created and signed in
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      user: { $ref: '#/components/schemas/User' }
                      token: { type: string, description: 'Send as `Authorization: Bearer <token>`.' }
        '403': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { description: Too many attempts }

  /auth/providers:
    get:
      tags: [Auth]
      security: []
      summary: Sign-in options this server offers
      responses:
        '200':
          description: Options
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      registration: { type: boolean }
                      google: { type: boolean, description: True once GOOGLE_CLIENT_ID and GOOGLE_CLIENT_SECRET are set. }

  /auth/google/redirect:
    get:
      tags: [Auth]
      security: []
      summary: Start Google sign-in (open in a browser)
      description: See docs/google-sign-in.md. Google returns to `/auth/google/callback`, which redirects to `return` with `?code=` or `?error=`.
      parameters:
        - name: return
          in: query
          required: true
          description: The app's URL scheme (`fitapp://…`) or an address on an origin in FRONTEND_ORIGINS.
          schema: { type: string }
      responses:
        '302': { description: To Google's sign-in page }
        '404': { description: Google sign-in is not set up on this server }
        '422': { description: Return address not allowed }

  /auth/google/token:
    post:
      tags: [Auth]
      security: []
      summary: Trade the one-time code from the Google return for an app token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string, description: Valid once, for two minutes. }
                device_name: { type: string, maxLength: 100 }
      responses:
        '200':
          description: Signed in
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      user: { $ref: '#/components/schemas/User' }
                      token: { type: string, description: 'Send as `Authorization: Bearer <token>`.' }
        '401': { $ref: '#/components/responses/Error' }

  /ai/coach:
    post:
      tags: [AI]
      summary: A summary of the week behind the health score and one tip to raise it
      description: The app computes the score from what FitApp collects (activity, steps, sleep duration and regularity, resting heart rate, water) and sends it with the week's numbers. The summary affirms what went well without numbers. 503 when the AI service is off or fails; the app then shows its own wording.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [score, week]
              properties:
                score: { type: integer, minimum: 0, maximum: 100 }
                label: { type: string }
                focus: { type: string, enum: [activity, steps, sleep, regularity, heart, hydration] }
                week: { type: object, description: 'Aggregates such as active minutes and sleep hours.' }
                today: { type: object }
      responses:
        '200': { description: 'Summary and tip', content: { application/json: { schema: { type: object, properties: { data: { type: object, properties: { summary: { type: string }, tip: { type: string } } } } } } } }
        '503': { $ref: '#/components/responses/Error' }

  /ai/quote:
    post:
      tags: [AI]
      summary: A personal line for the daily reminder
      description: Written once per day, part of day and focus. The same four AI routes exist under /demo/ai/* without sign-in when the server sets AI_DEMO=true (10 requests a minute).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [date]
              properties:
                date: { type: string, format: date }
                part_of_day: { type: string, enum: [morning, afternoon, evening, night] }
                focus: { type: string }
                recent: { type: object }
      responses:
        '200': { description: 'Quote', content: { application/json: { schema: { type: object, properties: { data: { type: object, properties: { quote: { type: string } } } } } } } }
        '503': { $ref: '#/components/responses/Error' }

  /ai/feedback:
    post:
      tags: [AI]
      summary: A short reaction to an entry just logged
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, entry]
              properties:
                kind: { type: string, enum: [mood, meal, drink, activity] }
                entry: { type: object, description: 'Numbers and categories only; notes are dropped.' }
                today: { type: object }
      responses:
        '200': { description: 'Feedback', content: { application/json: { schema: { type: object, properties: { data: { type: object, properties: { feedback: { type: string } } } } } } } }
        '503': { $ref: '#/components/responses/Error' }

  /ai/insights:
    post:
      tags: [AI]
      summary: Up to three insights across areas from a summary of recent days
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [summary]
              properties:
                summary: { type: object, description: 'Per-day aggregates and goals.' }
      responses:
        '200':
          description: Insights
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      insights:
                        type: array
                        items:
                          type: object
                          properties:
                            area: { type: string }
                            title: { type: string }
                            body: { type: string }
                            action: { type: string, nullable: true }
        '503': { $ref: '#/components/responses/Error' }

  /logout:
    post:
      tags: [Auth]
      summary: Revoke the current token
      responses:
        '200': { description: Revoked }
        '401': { $ref: '#/components/responses/Error' }

  /user:
    get:
      tags: [Auth]
      summary: Current user profile
      responses:
        '200':
          description: Profile
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Error' }
    patch:
      tags: [Auth]
      summary: Update name, timezone or goals
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                timezone: { type: string, example: Asia/Dhaka }
                goals: { $ref: '#/components/schemas/Goals' }
                preferences: { $ref: '#/components/schemas/Preferences' }
      responses:
        '200':
          description: Updated profile
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/User' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /fitness/days:
    get:
      tags: [Fitness]
      summary: Daily summaries for a date range
      description: |
        Returns one entry per date in the range, oldest first, including dates without data.
        Without `from`/`to` the range is the 30 days ending today in the user's timezone.
        When several sources reported a metric for the same date, the most recently updated record is used.
      parameters:
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date }, description: 'Inclusive; at most 366 days after `from`.' }
      responses:
        '200':
          description: Days
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/DaySummary' }
                  meta:
                    type: object
                    properties:
                      from: { type: string, format: date }
                      to: { type: string, format: date }
                      timezone: { type: string }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /fitness/heart-rate/{date}:
    get:
      tags: [Fitness]
      summary: Heart-rate samples for one local date
      parameters:
        - { name: date, in: path, required: true, schema: { type: string, format: date } }
      responses:
        '200':
          description: Samples, ordered by time (empty when none)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      date: { type: string, format: date }
                      samples:
                        type: array
                        items: { $ref: '#/components/schemas/HeartRateSample' }

  /fitness/readings/{kind}/{date}:
    get:
      tags: [Fitness]
      summary: Stress or blood-oxygen readings for one local date
      parameters:
        - { name: kind, in: path, required: true, schema: { type: string, enum: [stress, spo2] } }
        - { name: date, in: path, required: true, schema: { type: string, format: date } }
      responses:
        '200':
          description: Readings ordered by time (empty when none); `value` is 0–100 for stress and % for SpO₂
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      kind: { type: string }
                      date: { type: string, format: date }
                      samples:
                        type: array
                        items:
                          type: object
                          properties:
                            at: { type: string, format: date-time }
                            value: { type: integer }
        '404': { description: Unknown kind }

  /fitness/status:
    get:
      tags: [Fitness]
      summary: Data sources and freshness
      responses:
        '200':
          description: Status
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      sources:
                        type: array
                        items: { $ref: '#/components/schemas/DataSource' }
                      last_ingested_at: { type: [string, 'null'], format: date-time }
                      latest_date: { type: [string, 'null'], format: date }
                      latest_heart_rate:
                        type: [object, 'null']
                        description: Most recent uploaded reading. It is the latest reading received, not a live value.
                        properties:
                          at: { type: string, format: date-time }
                          bpm: { type: integer }
                          source: { type: string }
                      timezone: { type: string }

  /ingest:
    post:
      tags: [Ingestion]
      summary: Upload activity, sleep and heart-rate data
      description: |
        Idempotent per record. Records are keyed by `(source.key, date)` (activity, sleep, resting heart rate)
        or `(source.key, at)` (heart-rate samples). Re-sending a day replaces it, so cumulative daily totals
        can be uploaded repeatedly during the day without double counting.

        * Activity: only the fields present are changed; send `null` to clear a value.
        * Sleep and resting heart rate: the record for that date is replaced.
        * Heart-rate samples: the local `date` is derived from `at` in `timezone` (default: the user's timezone).

        At least one of `activity`, `workouts`, `sleep`, `heart_rate`, `stress`, `spo2` or `skin_temperature` is required. Rate limit: 60 requests/minute.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IngestPayload' }
            examples:
              sample:
                summary: Two days from one bridge
                externalValue: ./examples/ingest-sample.json
      responses:
        '200':
          description: Stored
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      source: { $ref: '#/components/schemas/DataSource' }
                      received:
                        type: object
                        properties:
                          activity_days: { type: integer }
                          sleep_sessions: { type: integer }
                          workouts: { type: integer }
                          resting_heart_rate_days: { type: integer }
                          heart_rate_samples: { type: integer, description: After removing duplicate instants }
        '401': { $ref: '#/components/responses/Error' }
        '403':
          description: Token lacks the `ingest` ability
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { description: Rate limited }

  /journal/mood:
    get:
      tags: [Journal]
      summary: Mood check-ins in a date range
      parameters: [{ $ref: '#/components/parameters/From' }, { $ref: '#/components/parameters/To' }]
      responses:
        '200': { description: Entries, content: { application/json: { schema: { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/MoodEntry' } } } } } } }
    post:
      tags: [Journal]
      summary: Record a mood check-in
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/MoodEntryInput' } } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/MoodEntry' } } } } } }
        '422': { $ref: '#/components/responses/ValidationError' }
  /journal/mood/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    put:
      tags: [Journal]
      summary: Replace a mood check-in
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/MoodEntryInput' } } } }
      responses:
        '200': { description: Updated }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [Journal]
      summary: Delete a mood check-in
      responses: { '200': { description: Deleted }, '404': { $ref: '#/components/responses/Error' } }

  /journal/meals:
    get:
      tags: [Journal]
      summary: Meals in a date range
      parameters: [{ $ref: '#/components/parameters/From' }, { $ref: '#/components/parameters/To' }]
      responses:
        '200': { description: Meals, content: { application/json: { schema: { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/Meal' } } } } } } }
    post:
      tags: [Journal]
      summary: Log a meal with its items
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/MealInput' } } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/Meal' } } } } } }
        '422': { $ref: '#/components/responses/ValidationError' }
  /journal/meals/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    put:
      tags: [Journal]
      summary: Replace a meal and its items
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/MealInput' } } } }
      responses: { '200': { description: Updated }, '404': { $ref: '#/components/responses/Error' }, '409': { $ref: '#/components/responses/Conflict' } }
    delete:
      tags: [Journal]
      summary: Delete a meal
      responses: { '200': { description: Deleted }, '404': { $ref: '#/components/responses/Error' } }

  /journal/hydration:
    get:
      tags: [Journal]
      summary: Drinks in a date range
      parameters: [{ $ref: '#/components/parameters/From' }, { $ref: '#/components/parameters/To' }]
      responses:
        '200': { description: Entries, content: { application/json: { schema: { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/HydrationEntry' } } } } } } }
    post:
      tags: [Journal]
      summary: Log a drink
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/HydrationInput' } } } }
      responses: { '201': { description: Created }, '422': { $ref: '#/components/responses/ValidationError' } }
  /journal/hydration/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    put:
      tags: [Journal]
      summary: Replace a drink entry
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/HydrationInput' } } } }
      responses: { '200': { description: Updated }, '404': { $ref: '#/components/responses/Error' }, '409': { $ref: '#/components/responses/Conflict' } }
    delete:
      tags: [Journal]
      summary: Delete a drink entry
      responses: { '200': { description: Deleted }, '404': { $ref: '#/components/responses/Error' } }

  /journal/cycle-days:
    get:
      tags: [Journal]
      summary: Cycle-tracker days in a date range
      parameters: [{ $ref: '#/components/parameters/From' }, { $ref: '#/components/parameters/To' }]
      responses:
        '200': { description: Days, content: { application/json: { schema: { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/CycleDay' } } } } } } }
  /journal/cycle-days/{date}:
    parameters:
      - { name: date, in: path, required: true, schema: { type: string, format: date } }
    put:
      tags: [Journal]
      summary: Create or replace the record for one date
      description: One record per user and date. Needs at least one of flow, symptoms or note.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                flow: { type: [string, 'null'], enum: [spotting, light, medium, heavy, null] }
                symptoms: { type: array, items: { $ref: '#/components/schemas/Symptom' } }
                note: { type: [string, 'null'], maxLength: 2000 }
                updated_at: { $ref: '#/components/schemas/Seen' }
      responses: { '200': { description: Replaced }, '201': { description: Created }, '409': { $ref: '#/components/responses/Conflict' }, '422': { $ref: '#/components/responses/ValidationError' } }
    delete:
      tags: [Journal]
      summary: Delete the record for one date
      responses: { '200': { description: Deleted }, '404': { $ref: '#/components/responses/Error' } }

components:
  parameters:
    From: { name: from, in: query, schema: { type: string, format: date }, description: 'With `to`; defaults to the last 30 days' }
    To: { name: to, in: query, schema: { type: string, format: date } }
    Id: { name: id, in: path, required: true, schema: { type: integer } }

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Sanctum personal access token.

  responses:
    Conflict:
      description: The record changed since the client loaded it
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Error:
      description: Error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ValidationError:
      description: Validation failed
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Error'
              - type: object
                properties:
                  errors:
                    type: object
                    additionalProperties: { type: array, items: { type: string } }
                    example: { 'activity.0.steps': ['The activity.0.steps field must be between 0 and 200000.'] }

  schemas:
    Seen:
      type: [string, 'null']
      format: date-time
      description: The `updated_at` the client last saw. If the record changed since, the update is refused with 409.

    Provenance:
      type: string
      enum: [manual]
      description: Journal records are always entered by the user; watch data comes only from ingestion.

    MoodEntryInput:
      type: object
      required: [recorded_at, mood]
      properties:
        recorded_at: { type: string, format: date-time, description: With offset; its local date becomes `date` }
        mood: { type: integer, minimum: 1, maximum: 5 }
        energy: { type: [integer, 'null'], minimum: 1, maximum: 5 }
        stress: { type: [integer, 'null'], minimum: 1, maximum: 5, description: Self-reported; unrelated to any watch stress score }
        emotions: { type: array, maxItems: 10, items: { type: string, pattern: '^[a-z][a-z -]{1,23}$' } }
        note: { type: [string, 'null'], maxLength: 2000, description: Stored encrypted }
        updated_at: { $ref: '#/components/schemas/Seen' }
    MoodEntry:
      allOf:
        - $ref: '#/components/schemas/MoodEntryInput'
        - type: object
          properties:
            id: { type: integer }
            date: { type: string, format: date }
            provenance: { $ref: '#/components/schemas/Provenance' }

    MealItem:
      type: object
      required: [name]
      description: Nutrition values are typed by the user or calculated by the FitApp client from its built-in food list (typical per-100 g values); nutrition_source says which. The server stores them as sent and never estimates.
      properties:
        name: { type: string, maxLength: 100 }
        quantity: { type: [number, 'null'], exclusiveMinimum: 0 }
        unit: { type: [string, 'null'], maxLength: 20, example: g }
        energy_kcal: { type: [number, 'null'], minimum: 0, maximum: 5000 }
        protein_g: { type: [number, 'null'], minimum: 0, maximum: 1000 }
        carbs_g: { type: [number, 'null'], minimum: 0, maximum: 1000 }
        fat_g: { type: [number, 'null'], minimum: 0, maximum: 1000 }
        nutrition_source:
          type: [string, 'null']
          enum: [database, entered, null]
          description: "database = calculated from the client food list, entered = typed by the user, null = no values."
    MealInput:
      type: object
      required: [eaten_at, meal_type, items]
      properties:
        eaten_at: { type: string, format: date-time }
        meal_type: { type: string, enum: [breakfast, lunch, dinner, snack] }
        note: { type: [string, 'null'], maxLength: 2000 }
        items: { type: array, minItems: 1, maxItems: 30, items: { $ref: '#/components/schemas/MealItem' } }
        updated_at: { $ref: '#/components/schemas/Seen' }
    Meal:
      allOf:
        - $ref: '#/components/schemas/MealInput'
        - type: object
          properties:
            id: { type: integer }
            date: { type: string, format: date }
            provenance: { $ref: '#/components/schemas/Provenance' }

    HydrationInput:
      type: object
      required: [recorded_at, volume_ml]
      properties:
        recorded_at: { type: string, format: date-time }
        volume_ml: { type: integer, minimum: 10, maximum: 5000 }
        updated_at: { $ref: '#/components/schemas/Seen' }
    HydrationEntry:
      allOf:
        - $ref: '#/components/schemas/HydrationInput'
        - type: object
          properties:
            id: { type: integer }
            date: { type: string, format: date }
            provenance: { $ref: '#/components/schemas/Provenance' }

    Symptom:
      type: string
      enum: [cramps, headache, bloating, back_pain, breast_tenderness, acne, fatigue, nausea, mood_changes, cravings]
    CycleDay:
      type: object
      properties:
        id: { type: integer }
        date: { type: string, format: date }
        flow: { type: [string, 'null'], enum: [spotting, light, medium, heavy, null] }
        symptoms: { type: array, items: { $ref: '#/components/schemas/Symptom' } }
        note: { type: [string, 'null'] }
        provenance: { $ref: '#/components/schemas/Provenance' }
        updated_at: { type: string, format: date-time }

    Error:
      type: object
      required: [message]
      properties:
        message: { type: string }

    User:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        email: { type: string }
        timezone: { type: string, example: Asia/Dhaka }
        goals: { $ref: '#/components/schemas/Goals' }
        preferences: { $ref: '#/components/schemas/Preferences' }
        created_at: { type: string, format: date-time }

    Preferences:
      type: object
      properties:
        trackers:
          type: object
          description: Complementary trackers shown in the app. Cycle tracking is opt-in.
          properties:
            mood: { type: boolean, default: true }
            food: { type: boolean, default: true }
            cycle: { type: boolean, default: false }

    Goals:
      type: object
      properties:
        steps: { type: integer, example: 8000 }
        active_kcal: { type: integer, example: 450 }
        distance_m: { type: integer, example: 6000 }
        sleep_min: { type: integer, example: 450 }

    DataSource:
      type: object
      properties:
        key: { type: string, example: my-bridge }
        name: { type: string }
        device: { type: [string, 'null'], description: Device name declared by the source }
        measurements:
          type: array
          description: Measurements the source declares it provides
          items: { $ref: '#/components/schemas/Measurement' }
        last_ingested_at: { type: [string, 'null'], format: date-time, description: Last successful upload (UTC) }
        latest_date: { type: [string, 'null'], format: date, description: Latest local date with any data }
        received:
          type: array
          description: Kinds of data FitApp has actually stored from this source
          items: { type: string, enum: [activity, workouts, sleep, resting_heart_rate, heart_rate, stress, spo2, skin_temperature] }

    Measurement:
      type: string
      enum: [steps, distance, active_energy, active_minutes, workouts, sleep, sleep_stages, sleep_score, heart_rate, resting_heart_rate, stress, spo2, skin_temperature]

    Workout:
      type: object
      properties:
        type: { type: string, example: running }
        start_at: { type: string, format: date-time }
        end_at: { type: string, format: date-time }
        duration_min: { type: integer }
        active_kcal: { type: [integer, 'null'] }
        distance_m: { type: [integer, 'null'] }
        avg_bpm: { type: [integer, 'null'] }
        max_bpm: { type: [integer, 'null'] }
        source: { type: string }

    DaySummary:
      type: object
      required: [date, activity, sleep, heart_rate, workouts]
      properties:
        date: { type: string, format: date }
        activity:
          type: [object, 'null']
          properties:
            steps: { type: [integer, 'null'] }
            distance_m: { type: [integer, 'null'] }
            active_kcal: { type: [integer, 'null'] }
            active_minutes: { type: [integer, 'null'] }
            source: { type: string }
        sleep:
          type: [object, 'null']
          description: Main sleep that ended on this date
          properties:
            start_at: { type: string, format: date-time }
            end_at: { type: string, format: date-time }
            duration_min: { type: integer }
            score: { type: [integer, 'null'], minimum: 0, maximum: 100 }
            stages:
              type: [object, 'null']
              properties:
                deep_min: { type: [integer, 'null'] }
                light_min: { type: [integer, 'null'] }
                rem_min: { type: [integer, 'null'] }
                awake_min: { type: [integer, 'null'] }
            source: { type: string }
        heart_rate:
          type: [object, 'null']
          properties:
            resting_bpm: { type: [integer, 'null'] }
            min_bpm: { type: [integer, 'null'] }
            max_bpm: { type: [integer, 'null'] }
            avg_bpm: { type: [integer, 'null'] }
            sample_count: { type: integer }
            source: { type: string }
        workouts:
          type: array
          description: Sessions from the most recently updated source for this date
          items: { $ref: '#/components/schemas/Workout' }
        stress:
          description: Watch-estimated stress (0–100) for the day
          oneOf: [{ $ref: '#/components/schemas/SignalDay' }, { type: 'null' }]
        spo2:
          description: Blood oxygen (%) readings dated this day, usually overnight
          oneOf: [{ $ref: '#/components/schemas/SignalDay' }, { type: 'null' }]
        skin_temperature:
          type: [object, 'null']
          properties:
            deviation_c: { type: number, description: °C relative to the wearer's baseline }
            source: { type: string }

    SignalDay:
      type: object
      properties:
        avg: { type: integer }
        min: { type: integer }
        max: { type: integer }
        sample_count: { type: integer }
        source: { type: string }

    HeartRateSample:
      type: object
      properties:
        at: { type: string, format: date-time }
        bpm: { type: integer }

    IngestPayload:
      type: object
      required: [source]
      properties:
        source:
          type: object
          required: [key, name]
          properties:
            key: { type: string, pattern: '^[a-z0-9][a-z0-9._-]{0,63}$', description: Stable identifier you choose for this source }
            name: { type: string, maxLength: 100 }
            device: { type: [string, 'null'], maxLength: 100, description: 'Device name to display, e.g. the watch model' }
            measurements:
              type: [array, 'null']
              description: Measurements this source can provide; shown as the source's capabilities
              items: { $ref: '#/components/schemas/Measurement' }
        timezone: { type: string, description: 'IANA zone of the device, e.g. Europe/Berlin. Defaults to the user timezone.' }
        workouts:
          type: array
          maxItems: 400
          description: Keyed by (source, start_at); re-sending a session replaces it.
          items:
            type: object
            required: [date, type, start_at, end_at]
            properties:
              date: { type: string, format: date }
              type: { type: string, pattern: '^[a-z][a-z_]{1,31}$', example: running }
              start_at: { type: string, format: date-time }
              end_at: { type: string, format: date-time, description: After start_at, at most 24 h later }
              active_kcal: { type: [number, 'null'], minimum: 0, maximum: 10000 }
              distance_m: { type: [number, 'null'], minimum: 0, maximum: 500000 }
              avg_bpm: { type: [integer, 'null'], minimum: 20, maximum: 250 }
              max_bpm: { type: [integer, 'null'], minimum: 20, maximum: 250 }
        activity:
          type: array
          maxItems: 400
          items:
            type: object
            required: [date]
            properties:
              date: { type: string, format: date }
              steps: { type: [integer, 'null'], minimum: 0, maximum: 200000 }
              distance_m: { type: [number, 'null'], minimum: 0, maximum: 500000 }
              active_kcal: { type: [number, 'null'], minimum: 0, maximum: 20000 }
              active_minutes: { type: [integer, 'null'], minimum: 0, maximum: 1440 }
        sleep:
          type: array
          maxItems: 400
          items:
            type: object
            required: [date, start_at, end_at]
            properties:
              date: { type: string, format: date, description: Local date the sleep ended }
              start_at: { type: string, format: date-time, description: Must include an offset or Z }
              end_at: { type: string, format: date-time, description: After start_at, at most 24 h later }
              score: { type: [integer, 'null'], minimum: 0, maximum: 100 }
              stages:
                type: [object, 'null']
                properties:
                  deep_min: { type: [integer, 'null'] }
                  light_min: { type: [integer, 'null'] }
                  rem_min: { type: [integer, 'null'] }
                  awake_min: { type: [integer, 'null'] }
        heart_rate:
          type: object
          properties:
            resting:
              type: array
              maxItems: 400
              items:
                type: object
                required: [date, bpm]
                properties:
                  date: { type: string, format: date }
                  bpm: { type: integer, minimum: 20, maximum: 250 }
            samples:
              type: array
              maxItems: 10000
              items:
                type: object
                required: [at, bpm]
                properties:
                  at: { type: string, format: date-time, description: Must include an offset or Z }
                  bpm: { type: integer, minimum: 20, maximum: 250 }
        stress:
          type: object
          description: The watch's own stress estimate. Stress a user reports belongs in mood check-ins.
          properties:
            samples:
              type: array
              maxItems: 10000
              items:
                type: object
                required: [at, value]
                properties:
                  at: { type: string, format: date-time }
                  value: { type: integer, minimum: 0, maximum: 100 }
        spo2:
          type: object
          properties:
            samples:
              type: array
              maxItems: 10000
              items:
                type: object
                required: [at, percent]
                properties:
                  at: { type: string, format: date-time }
                  percent: { type: integer, minimum: 70, maximum: 100 }
        skin_temperature:
          type: array
          maxItems: 400
          description: Nightly deviation from the wearer's baseline (not absolute temperature), keyed by local date.
          items:
            type: object
            required: [date, deviation_c]
            properties:
              date: { type: string, format: date }
              deviation_c: { type: number, minimum: -5, maximum: 5 }
